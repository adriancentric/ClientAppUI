<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <div class="form-title">
    <h2>Welcome back</h2>
    <p>Sign in to your account</p>
  </div>

  <!-- Username field -->
  <div class="margin-bottom">
    <label for="username">Username <span class="required">*</span></label>
    <input id="username" type="text" formControlName="username" autocomplete="username" />
    @if (username.errors?.['required'] && username.touched) {
      <p class="error">Username is required.</p>
    }
  </div>

  <!-- Password field -->
  <div class="margin-bottom">
    <label for="password">Password <span class="required">*</span></label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (password.errors?.['required'] && password.touched) {
      <p class="error">Password is required.</p>
    }
  </div>

  <!-- API error shown when login fails -->
  @if (errorMessage) {
    <p class="error api-error">{{ errorMessage }}</p>
  }

  <button type="submit" [disabled]="loginForm.invalid">Sign in</button>

  <p class="switch-link">
    Don't have an account? <a routerLink="/register">Register</a>
  </p>
</form>
